# Root config for train_probe.py (hydra entrypoint) — trains a pose / forward-dynamics
# probe on a frozen encoder.
#   torchrun --nproc_per_node=N train_probe.py
#   torchrun --nproc_per_node=N train_probe.py train.batch_size=128 pose_probe.lr=2e-4
#   torchrun --nproc_per_node=N train_probe.py encoder.type=vae
defaults:
  - data/probe: recon_sacson_scand
  - _self_

output_dir: logs_probe        # experiment dir = ${output_dir}/${run_name}
run_name: probe_forward_linear
seed: 0
config_path: RAE/configs/stage1/pretrained/DINOv2-B.yaml

# Frozen encoder (polymorphic: rae | vae | resnet50 | dinov2_cls | pixel).
encoder:
  type: rae
  config_path: RAE/configs/stage1/pretrained/DINOv2-B.yaml

# Probe hyperparameters (pass-through dict).
pose_probe:
  task: forward_dynamics
  action_dim: 3
  forward_step: 2
  predict_residual: true
  forward_loss: huber
  lr: 1e-4
  min_lr: 1e-4
  weight_decay: 0.01
  grad_clip_val: 1.0
  warmup_steps: 0
  max_steps: 60000
  log_every_steps: 100
  eval_every_steps: 1000
  save_every_steps: 1000

train:
  batch_size: 256
  num_workers: 16
  eval_num_batches: 30
  epochs: null            # null -> use pose_probe.max_steps
  log_every: null         # null -> pose_probe.log_every_steps
  ckpt_every: null        # null -> pose_probe.save_every_steps
  eval_every: null        # null -> pose_probe.eval_every_steps
  bfloat16: true
  torch_compile: false
  resume: ""
  exp_dir: ""
  test_only: false
  only_spatial_random_test: false
  test_action_modes: ""
  action_random_mode: shuffle

wandb:
  enabled: false
  project: raenwm-probe
  entity: null
  run_name: null
  tags: [probe, forward_dynamics, linear]
  notes: "Linear forward dynamics probe: predict z_{t+k} from z_t and action."

hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/${run_name}/hydra
